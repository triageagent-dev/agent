# ko build configuration for the image without OBI (no -tags obi): the
# controller and the OTLP role (--mode=otlp) never run the eBPF role, so they
# need neither its code nor the generated eBPF bindings. --mode role "ebpf"
# fails fast in this binary (ebpf_stub.go). Used with KO_CONFIG_PATH=hack/ko-otlp
# (make ko-push-otlp, CI's image job); the DaemonSet keeps the OBI image of
# ../../.ko.yaml.
defaultBaseImage: cgr.dev/chainguard/static:latest-glibc@sha256:77d8b8925dc27970ec2f48243f44c7a260d52c49cd778288e4ee97566e0cb75b
builds:
- id: triage-agent
  main: ./cmd/triage-agent
  env:
  - CGO_ENABLED=0
  # Mirrors the Makefile's LDFLAGS (and the sibling triageagent-dev/core .ko.yaml).
  # Without these every image reports version "dev" and two different builds are
  # indistinguishable in logs and in the push hello frame. VERSION/GIT_COMMIT/
  # BUILD_DATE are exported by the Makefile's ko-image / ko-push targets.
  ldflags:
  - -s -w
  - -X main.version={{.Env.VERSION}}
  - -X main.gitCommit={{.Env.GIT_COMMIT}}
  - -X main.buildDate={{.Env.BUILD_DATE}}
  kodata: false
