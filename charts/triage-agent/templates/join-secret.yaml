{{- $core := include "triage-agent.core" . | fromYaml }}
{{- if and $core.agentKey (ne $core.storage "secret") }}
{{- fail "core.agentKey needs core.storage: secret" }}
{{- end }}
{{- if and $core.enabled $core.caFingerprint (eq $core.storage "secret") }}
{{- /* Agent join identity (core docs/todo/agent-join.md). Created empty; the
       agent writes its key, certificate and the saved core CA into it.
       The only data the chart writes is enroll.key, a one-time agent key
       (core ADR-090). The agent removes enroll.key once its certificate is
       issued. data is always rendered, even empty: if it were left out,
       an upgrade that drops core.agentKey would make Helm delete the whole
       data field and with it the agent's key and certificate. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triage-agent.fullname" . }}-join
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
type: Opaque
data:
{{- with $core.agentKey }}
  enroll.key: {{ . | b64enc }}
{{- else }} {}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "triage-agent.fullname" . }}-join
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-join" (include "triage-agent.fullname" .) | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "triage-agent.fullname" . }}-join
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "triage-agent.fullname" . }}-join
subjects:
  - kind: ServiceAccount
    name: {{ include "triage-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
