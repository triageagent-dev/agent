# OpenTelemetry Collector -> Triage agent. The Triage components of a working
# collector, as they run there; merge into your collector config.
#
# Also add the connectors to your own pipelines:
#   logs pipeline    exporters: [<yours>, count]
#   traces pipeline  exporters: [<yours>, span_metrics]
#
# For an agent that watches no Kubernetes objects (kubernetes.watch: false,
# ADR-0021) the k8s_cluster receiver below is required: the agent builds its
# applications from the desired and ready pod counts it sends. It reads
# workloads cluster-wide, so the Collector's ServiceAccount needs list and watch
# on Deployments, StatefulSets, DaemonSets, ReplicaSets, Pods and Namespaces
# (it already does if it runs the k8s_attributes processor); the agent then
# needs none. Replace <tenant-namespaces> with the tenant's namespaces.
#
# env:   TRIAGE_OTLP_ENDPOINT   agent OTLP address, host:4317
#        K8S_NODE_IP, MY_POD_IP, K8S_NODE_NAME   downward API
# files: /etc/triage-otlp/ca.crt, tls.crt, tls.key   client certificate whose
#        URI SAN is spiffe://<domain>/tenant/<tenant>
#
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:MY_POD_IP}:4317
      http:
        cors:
          allowed_headers:
          - content-type
          - traceparent
          - baggage
          allowed_origins:
          - http://*
          - https://*
        endpoint: ${env:MY_POD_IP}:4318
  # Workload readiness for the agent's applications. Run it on ONE Collector:
  # every Collector that has it sends the same workloads, so use the leader
  # elector below (several Collectors) or a single-replica Deployment.
  k8s_cluster:
    collection_interval: 30s
    k8s_leader_elector: k8s_leader_elector/k8s_cluster
  prometheus/cadvisor:
    config:
      scrape_configs:
      - authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        job_name: kubelet-cadvisor
        metric_relabel_configs:
        - action: keep
          regex: container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|memory_usage_bytes|spec_memory_limit_bytes|spec_cpu_quota|spec_cpu_period|oom_events_total|pressure_(cpu|memory|io)_waiting_seconds_total)|machine_(cpu_cores|memory_bytes)
          source_labels:
          - __name__
        - action: drop
          regex: .+
          source_labels:
          - container
        - action: drop
          regex: .+
          source_labels:
          - image
        metrics_path: /metrics/cadvisor
        scheme: https
        scrape_interval: 15s
        static_configs:
        - targets:
          - ${env:K8S_NODE_IP}:10250
        tls_config:
          insecure_skip_verify: true
extensions:
  k8s_leader_elector/k8s_cluster:
    auth_type: serviceAccount
    lease_name: k8s.cluster.receiver.opentelemetry.io
    lease_namespace: <collector namespace>
connectors:
  count:
    logs:
      log.errors:
        conditions:
        - severity_number >= SEVERITY_NUMBER_ERROR
        description: Log records at ERROR or above
      log.lines:
        description: All log records
      log.warns:
        conditions:
        - severity_number >= SEVERITY_NUMBER_WARN and severity_number < SEVERITY_NUMBER_ERROR
        description: Log records at WARN
  span_metrics:
    add_resource_attributes: true
    dimensions:
    - name: http.response.status_code
    - name: http.status_code
    - name: http.request.method
    - name: http.method
    - name: http.route
    - name: rpc.system
    - name: rpc.method
    - name: rpc.grpc.status_code
    - name: server.address
    - name: net.peer.name
processors:
  filter/triage:
    error_mode: ignore
    metrics:
      metric:
      - not IsMatch(name, "^(traces[.]span[.]metrics[.](duration|calls)|log[.](errors|warns|lines)|container_.*|machine_.*|k8s[.](deployment[.](desired|available)|statefulset[.](desired_pods|ready_pods)|daemonset[.](desired_scheduled_nodes|ready_nodes)))$")
      # The agent files everything under one tenant: pass only its workloads.
      - IsMatch(name, "^k8s[.]") and not IsMatch(resource.attributes["k8s.namespace.name"], "^(<tenant-namespaces>)$")
  k8s_attributes:
    extract:
      metadata:
      - k8s.namespace.name
      - k8s.pod.name
      - k8s.pod.uid
      - k8s.node.name
      - k8s.pod.start_time
      - k8s.deployment.name
      - k8s.replicaset.name
      - k8s.replicaset.uid
      - k8s.daemonset.name
      - k8s.daemonset.uid
      - k8s.job.name
      - k8s.job.uid
      - k8s.container.name
      - k8s.cronjob.name
      - k8s.statefulset.name
      - k8s.statefulset.uid
      - container.image.tag
      - container.image.name
      - k8s.cluster.uid
      - service.namespace
      - service.name
      - service.version
      - service.instance.id
      otel_annotations: true
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: container.id
    - sources:
      - from: resource_attribute
        name: k8s.pod.ip
    - sources:
      - from: resource_attribute
        name: k8s.pod.uid
    - sources:
      - from: connection
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  deltatocumulative: {}
exporters:
  otlp_grpc/triage:
    endpoint: ${env:TRIAGE_OTLP_ENDPOINT}
    sending_queue:
      batch: {}
    tls:
      ca_file: /etc/triage-otlp/ca.crt
      cert_file: /etc/triage-otlp/tls.crt
      key_file: /etc/triage-otlp/tls.key
service:
  extensions:
  - k8s_leader_elector/k8s_cluster
  pipelines:
    metrics/triage:
      exporters:
      - otlp_grpc/triage
      processors:
      - filter/triage
      - k8s_attributes
      - memory_limiter
      - deltatocumulative
      receivers:
      - otlp
      - count
      - span_metrics
      - prometheus/cadvisor
      - k8s_cluster
